name: matt-daily
# Matt's LIFE OS Jobs run (MEJ-215). Once a day, and by hand: find jobs, read them, score them against Matt's profile, publish the qualified ones to his
# Notion Job Ledger, and match them against his LinkedIn connections. Everything runs here: the job store is a MariaDB service container whose data
# is saved, gzipped and ENCRYPTED (AES-256, key in the STATE_KEY secret), to the `state` branch at the end of every run and restored at the start of the
# next. The repository is a public fork, so the snapshot is unreadable without the key; logs print counts only, never job or contact details.
#
# Secrets (Settings > Secrets and variables > Actions):
#   FIT_PROFILE_JSON                    required: Matt's fit profile (private; never committed)
#   STATE_KEY                           required: a long random passphrase that encrypts the store snapshot (keep a copy; losing it means starting over)
#   NOTION_API_TOKEN                    required to publish: the "LIFE OS Jobs" Notion integration's token
#   NOTION_JOB_LEDGER_DATA_SOURCE_ID    required to publish: the Job Ledger data source id
#   NETWORK_HANDOFF_PAGE_ID             optional: the "LinkedIn Connections" Notion page (Connections.csv attached) -> referral matching
#   GMAIL_OAUTH_CLIENT_ID, GMAIL_OAUTH_CLIENT_SECRET, GMAIL_OAUTH_REFRESH_TOKEN   optional: LinkedIn / Jobright job-alert emails from Gmail
# A missing optional secret skips its steps; nothing else changes.
on:
  schedule:
    - cron: "13 14 * * *"              # 14:13 UTC daily = 6:13 AM Pacific in winter (PST), 7:13 AM in summer (PDT)
  workflow_dispatch:
    inputs:
      live:
        description: "Write to the store and Notion (unticked = dry run: reads and counts only; the store is not saved)"
        type: boolean
        default: true
      notion_check:
        description: "Notion check only: test the Notion connection (about 1 minute) and stop; nothing else runs"
        type: boolean
        default: false
permissions:
  contents: write                       # push the store snapshot to the `state` branch
concurrency:
  group: matt-daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: lifeos
          MARIADB_USER: lifeos
          MARIADB_PASSWORD: lifeos
          MARIADB_ROOT_PASSWORD: lifeos-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      LIVE: ${{ github.event_name == 'schedule' || inputs.live }}
      LIFEOS_STORE_DIRECT: 127.0.0.1:3306
      LIFEOS_ACQ_DB_NAME: lifeos
      LIFEOS_ACQ_DB_USER: lifeos
      LIFEOS_ACQ_DB_PASSWORD: lifeos       # the throwaway service container's own password; it is never reachable outside this job
      V7_FIT_GATE: "true"
      BOARDS_BACKFILL: "on"
      FIT_PROFILE_JSON: ${{ secrets.FIT_PROFILE_JSON }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_JOB_LEDGER_DATA_SOURCE_ID: ${{ secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID }}
      NETWORK_HANDOFF_PAGE_ID: ${{ secrets.NETWORK_HANDOFF_PAGE_ID }}
      GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
      GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
      GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
      HAS_NOTION: ${{ secrets.NOTION_API_TOKEN != '' && secrets.NOTION_JOB_LEDGER_DATA_SOURCE_ID != '' }}
      HAS_NETWORK: ${{ secrets.NETWORK_HANDOFF_PAGE_ID != '' && secrets.NOTION_API_TOKEN != '' }}
      HAS_GMAIL: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: ./.github/actions/python
      - name: Check the profile secret
        run: |
          if [ -z "$FIT_PROFILE_JSON" ]; then echo "::error::FIT_PROFILE_JSON is not set (docs/MATT_SETUP.md step 3)"; exit 1; fi
          if [ ${#STATE_KEY} -lt 20 ]; then echo "::error::STATE_KEY is not set or shorter than 20 characters (docs/MATT_SETUP.md step 3)"; exit 1; fi
          python -c "import os; from lifeos.jobs.fit import profile; p = profile.load(os.environ); print('profile ok, hash', p.hash)"
      - name: Notion check only
        if: ${{ inputs.notion_check }}
        run: |
          set -o pipefail
          python -m lifeos.jobs.notion_preflight | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Restore the store from the state branch
        if: ${{ !inputs.notion_check }}
        run: |
          sudo apt-get install -y -q mariadb-client >/dev/null
          if git fetch --depth=1 origin state 2>/dev/null && git show FETCH_HEAD:store.sql.gz.enc > /tmp/store.sql.gz.enc 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in /tmp/store.sql.gz.enc | gunzip -c | mysql -h127.0.0.1 -ulifeos -plifeos lifeos
            echo "restored $(du -h /tmp/store.sql.gz.enc | cut -f1) encrypted snapshot" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no snapshot yet: starting with an empty store" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          python -m lifeos.jobs.store
      - name: Run the day's stages
        if: ${{ !inputs.notion_check }}
        run: |
          flag=$([ "$LIVE" = "true" ] && echo --live)
          failed=""
          step() { echo "::group::$*"; if timeout 1500 "$@" 2>&1 | tee /tmp/step.log; then echo "::endgroup::"; else echo "::endgroup::"; echo "::warning::step failed: $*"; failed="$failed|$*"; fi; }
          set -o pipefail
          NOTION_OK=false; NETWORK_OK=false
          if [ "$HAS_NOTION" = "true" ]; then
            if python -m lifeos.jobs.notion_preflight | tee -a "$GITHUB_STEP_SUMMARY"; then NOTION_OK=true; else failed="$failed|notion-preflight (connect LIFE OS Jobs in Notion)"; fi
            NETWORK_OK=$(grep -o 'NETWORK_OK=.*' "$GITHUB_ENV" | tail -1 | cut -d= -f2)
          fi
          if [ "$HAS_GMAIL" = "true" ]; then
            step python -m lifeos.sources.newsletters.sweep $flag
            step python -m lifeos.sources.newsletters.ingest $flag
          fi
          step python -m lifeos.run linkedin-search --limit 40 $flag
          step python -m lifeos.run resolve-linkedin --limit 150 $flag          # reads the LinkedIn search's jobs (and, with Gmail, the alert emails' jobs)
          step python -m lifeos.run boards --limit 900 $flag
          # first-pass reads of never-read boards: 450 a pass, until none remain (about 24 passes the first day, then a few new boards a day)
          for pass in $(seq 1 30); do
            step python -m lifeos.run boards-backfill --limit 450 $flag
            grep -q '"remaining": 0' /tmp/step.log && break
            grep -q '"due": 0' /tmp/step.log && break
            grep -q '"backfill": "off"' /tmp/step.log && break
          done
          step python -m lifeos.run enrich --limit 600 $flag
          step python -m lifeos.run fit --limit 6000 $flag          # every job read today (the first full board pass reads ~2,300; Fit is ~10 jobs a second)
          if [ "$NOTION_OK" = "true" ]; then
            step python -m lifeos.run audit-ready $flag
            step python -m lifeos.run publish --limit 100 $flag             # about 13 s a page with its read-back; the rest publish on the next runs
            step python -m lifeos.run audit $flag
          elif [ "$HAS_NOTION" != "true" ]; then
            echo "::notice::NOTION_API_TOKEN / NOTION_JOB_LEDGER_DATA_SOURCE_ID not set: nothing is published"
          fi
          step python -m lifeos.run expire-holds $flag
          if [ "$HAS_NETWORK" = "true" ] && [ "$NETWORK_OK" = "true" ]; then
            echo "::group::network-import"
            if timeout 600 python -m lifeos.run network-import $flag 2>&1 | tee /tmp/step.log; then imported=true; else imported=false; fi
            echo "::endgroup::"
            if grep -q NETWORK_NO_FILE /tmp/step.log; then
              echo "::notice::No Connections.csv on the LinkedIn Connections page yet: referral matching starts once it is attached (docs/MATT_SETUP.md step 8)"
            elif [ "$imported" = "true" ]; then
              step python -m lifeos.run network-match
              [ "$NOTION_OK" = "true" ] && step python -m lifeos.run network-surface --limit 60 $flag
            else
              failed="$failed|network-import"
            fi
          fi
          if [ "$HAS_GMAIL" = "true" ]; then step python -m lifeos.sources.newsletters.finalize $flag; fi
          python -m lifeos.jobs.store | tee -a "$GITHUB_STEP_SUMMARY"
          echo "failed steps: ${failed:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "FAILED_STEPS=${failed}" >> "$GITHUB_ENV"
      - name: Save the store to the state branch
        if: ${{ always() && env.LIVE == 'true' && !inputs.notion_check }}
        run: |
          set -o pipefail
          mysqldump -h127.0.0.1 -ulifeos -plifeos --single-transaction --no-tablespaces lifeos | gzip -9 \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:STATE_KEY -out /tmp/store.sql.gz.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:STATE_KEY -in /tmp/store.sql.gz.enc | gunzip -t     # read back before replacing the last good snapshot
          size=$(stat -c %s /tmp/store.sql.gz.enc)
          if [ "$size" -gt 95000000 ]; then echo "::error::store snapshot is ${size} bytes, over GitHub's file limit"; exit 1; fi
          # a separate worktree, so the checked-out code (and the post-job steps that need it) stays in place
          git worktree add -q --orphan -b state-new /tmp/state-tree
          cd /tmp/state-tree
          git config user.name "matt-daily"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          cp /tmp/store.sql.gz.enc store.sql.gz.enc
          git add store.sql.gz.enc
          git commit -qm "store snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin state-new:state
          echo "saved $(du -h store.sql.gz.enc | cut -f1) encrypted snapshot" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail the run when a stage failed (after the store is saved)
        if: ${{ env.FAILED_STEPS != '' }}
        run: |
          echo "::error::failed steps: $FAILED_STEPS"
          exit 1
